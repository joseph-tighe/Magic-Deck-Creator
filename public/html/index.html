<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Magic Deck Maker</title>
        <link rel="stylesheet" href="/css/styles.css" />
    </head>
    <body>
        <header>
            <h1>Magic Deck Maker</h1>
        </header>

        <main>
            <section class="search-section">
                <div class="search-bar">
                    <input type="text" placeholder="Search for a card..." />
                    <button id="search-for-card">Search</button>
                </div>
                <div class="filters">
                    <select>
                        <option>All Colors</option>
                        <option>White</option>
                        <option>Blue</option>
                        <option>Black</option>
                        <option>Red</option>
                        <option>Green</option>
                        <option>Colorless</option>
                    </select>
                    <select>
                        <option>All Types</option>
                        <option>Creature</option>
                        <option>Sorcery</option>
                        <option>Instant</option>
                        <option>Enchantment</option>
                        <option>Artifact</option>
                        <option>Planeswalker</option>
                        <option>Land</option>
                    </select>
                    <select>
                        <option>Any Mana Cost</option>
                        <option>0-1</option>
                        <option>2-3</option>
                        <option>4-5</option>
                        <option>6+</option>
                    </select>
                </div>
            </section>
            <section class="results">
                <h2>Search Results</h2>
                <div class="card-grid"></div>
            </section>
            <section class="deck">
                <h2>Your Deck</h2>
                <div class="card-grid"></div>
            </section>
        </main>
        <script src="../js/main.js"></script>
    </body>
</html>
